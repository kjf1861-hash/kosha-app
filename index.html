<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کوشا — همیار پرتلاش معلم</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease-out, visibility 0.8s ease-out; }
        .splash-logo { margin-bottom: 10px; animation: bounce 2s infinite ease-in-out; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); }
        .splash-title { color: white; font-size: 2rem; font-weight: bold; margin-top: 20px; opacity: 0; animation: fadeIn 1.5s forwards 0.5s; }
        .splash-subtitle { color: rgba(255, 255, 255, 0.8); font-size: 1rem; margin-top: 10px; opacity: 0; animation: fadeIn 1.5s forwards 1s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .splash-hidden { opacity: 0; visibility: hidden; }
        
        .page-section { display: none; }
        .page-section.active { display: block; }
        
        .filter-btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 15px; }
        .filter-btn { padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border-color); background: white; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .input-error {
            border-color: #dc2626 !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1) !important;
        }
        
        .view-toggle-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .view-toggle-btn { flex: 1; padding: 8px; border: 2px solid var(--border-color); background: white; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: bold; color: var(--text-muted); }
        .view-toggle-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        
        .page-header-title { text-align: center; font-size: 1.6rem; font-weight: bold; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">
            <svg width="120" height="120" viewBox="0 0 512 512">
                <defs><linearGradient id="splash-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A90E2"/><stop offset="100%" stop-color="#357ABD"/></linearGradient></defs>
                <rect width="512" height="512" rx="115" fill="url(#splash-bg)"/><circle cx="420" cy="90" r="60" fill="#ffffff" opacity="0.15"/><circle cx="90" cy="420" r="80" fill="#ffffff" opacity="0.1"/>
                <path d="M 256 130 L 140 185 L 256 240 L 372 185 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
                <path d="M 140 185 L 140 250 C 140 250 170 280 256 280 C 342 280 372 250 372 250 L 372 185" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
                <path d="M 372 185 L 372 260" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/><circle cx="372" cy="270" r="14" fill="#ffffff"/>
                <path d="M 190 320 L 322 320 L 322 360 C 322 360 280 380 256 380 C 232 380 190 360 190 360 Z" fill="#ffffff" opacity="0.9"/>
            </svg>
        </div>
        <div class="splash-title">کوشا</div>
        <div class="splash-subtitle">همیار پرتلاش معلم</div>
    </div>

    <div id="app-container" style="display: none;">
        <header class="app-header">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تغییر حالت شب و روز" aria-label="تغییر حالت شب و روز">
                <span id="themeIcon">🌙</span>
            </button>
            <button class="settings-toggle" onclick="openSettingsModal()" title="تنظیمات">
                <span>⚙️</span>
            </button>
            <h1>کوشا</h1>
            <p id="header-subtitle">همیار پرتلاش معلم</p>
        </header>

        <div class="container">
            
            <!-- تب ۱: کلاس (آمار و ارقام) -->
            <div id="page-class" class="page-section active">
                <div class="page-header-title">
                    🏫 کلاس
                </div>
                
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <div class="dc-icon">👦</div>
                        <div class="dc-value" id="stat-students">0</div>
                        <div class="dc-label">دانش‌آموز</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="dc-icon">📚</div>
                        <div class="dc-value" id="stat-subjects">0</div>
                        <div class="dc-label">درس</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="dc-icon">📅</div>
                        <div class="dc-value" id="stat-sessions">0</div>
                        <div class="dc-label">جلسه</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="dc-icon">📝</div>
                        <div class="dc-value" id="stat-records">0</div>
                        <div class="dc-label">ارزشیابی</div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="card-title">🏆 شاگردان برتر</h2>
                    <div id="dashboard-top-students" class="list-group"></div>
                </div>

                <div class="card">
                    <h2 class="card-title">📈 گزارش امتیازات کلاس</h2>
                    <div id="class-score-report-section">
                        <div id="reports-list" class="list-group"></div>
                        <div style="margin-top: 15px; display: flex; gap: 10px;">
                            <button type="button" class="btn btn-secondary btn-block" onclick="exportClassCSV()">📗 خروجی اکسل</button>
                            <button type="button" class="btn btn-secondary btn-block" onclick="window.print()">🖨️ چاپ</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب ۲: دانش‌آموزان -->
            <div id="page-students" class="page-section">
                <div class="page-header-title">
                    👦 دانش‌آموزان
                </div>

                <div class="card">
                    <h2 class="card-title">➕ افزودن دانش‌آموز</h2>
                    <form id="student-form">
                        <div class="form-group"><label class="form-label" for="studentFirstName">نام</label><input type="text" id="studentFirstName" class="form-control" placeholder="ارسلان" autocomplete="on" required></div>
                        <div class="form-group"><label class="form-label" for="studentLastName">نام خانوادگی</label><input type="text" id="studentLastName" class="form-control" placeholder="قاسمی" autocomplete="on" required></div>
                        <button type="submit" class="btn btn-primary mt-4">➕ ثبت دانش‌آموز</button>
                    </form>
                </div>

                <div class="card">
                    <h2 class="card-title" style="justify-content: space-between;">
                        <span style="display: flex; align-items: center; gap: 8px;">📋 فهرست دانش‌آموزان</span>
                        <button type="button" class="btn btn-danger btn-sm" onclick="resetAllStudents()" title="حذف همه دانش‌آموزان" style="padding: 4px 8px; border-radius: 8px;">🗑️</button>
                    </h2>
                    <div id="students-list" class="list-group"></div>
                    <div id="students-pagination" class="pagination-container" style="display:none;">
                        <button type="button" class="pagination-btn" id="btnPrevStudents" onclick="changePage('students', -1)">قبلی</button>
                        <span class="pagination-info" id="studentsPageInfo">صفحه ۱</span>
                        <button type="button" class="pagination-btn" id="btnNextStudents" onclick="changePage('students', 1)">بعدی</button>
                    </div>
                </div>
            </div>
